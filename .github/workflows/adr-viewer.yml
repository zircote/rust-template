---
name: ADR Viewer

"on":
  push:
    branches: [main, master]
    paths:
      - 'docs/adr/**'
  workflow_dispatch:

# Read-only: the job generates ADR HTML and uploads it as an artifact. It
# does not commit or deploy to Pages (Pages deployment is documented but not
# implemented here), so no write scopes are needed.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    name: Generate HTML Viewer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate ADR HTML
        # main
        uses: zircote/adrscope@639a76f859dd4c0b7524f36bb27626bdc5d5ad06
        with:
          command: html
          adr-path: docs/adr
          output-path: adr-viewer

      - name: Upload artifact
        # v4.6.0
        uses: actions/upload-artifact@ea3f73d3e6f8268b4a40da165a72ca6a06e37770
        with:
          name: adr-viewer
          path: adr-viewer/
          retention-days: 90

# To enable GitHub Pages deployment, see:
# https://github.com/zircote/adrscope#github-pages-deployment
