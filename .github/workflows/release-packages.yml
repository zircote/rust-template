---
name: Release Packages

"on":
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
      SNAPCRAFT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  homebrew:
    name: Update Homebrew Formula
    runs-on: macos-latest
    steps:
      - name: Checkout homebrew tap
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: >-
            ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Get release info
        id: release
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          TARBALL_URL="https://github.com/${REPO}"
          TARBALL_URL+="/archive/refs/tags/v${VERSION}"
          TARBALL_URL+=".tar.gz"
          echo "tarball_url=$TARBALL_URL" >> "$GITHUB_OUTPUT"

          SHA256=$(curl -sL "$TARBALL_URL" \
            | sha256sum | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.release.outputs.tarball_url }}
          SHA: ${{ steps.release.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          cat > homebrew-tap/Formula/rust-template.rb << FORMULA
          class RustTemplate < Formula
            desc "Modern Rust project template"
            homepage "https://github.com/${REPO}"
            url "${TARBALL}"
            sha256 "${SHA}"
            license "MIT"
            version "${VERSION}"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match version.to_s,
                shell_output("#{bin}/rust-template --version")
            end
          end
          FORMULA

      - name: Commit and push formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add Formula/rust-template.rb
          git commit -m \
            "rust-template: update to ${VERSION}"
          git push

  snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build snap
        # v1.3.0
        uses: >-
          snapcore/action-build@3bdaa03e89fbf4598ba4c501055a582c77b6a75a
        id: build

      - name: Upload snap artifact
        # v4.6.2
        uses: >-
          actions/upload-artifact@47309c993abb98030a35d55ef7ff34b7fa1074b5
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}
          retention-days: 90

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SNAP: ${{ steps.build.outputs.snap }}
        run: |
          gh release upload "$TAG" "$SNAP" --clobber

      - name: Publish to Snap Store
        if: secrets.SNAPCRAFT_TOKEN != ''
        # v1.2.0
        uses: >-
          snapcore/action-publish@2f62f3ca778de25a88f1e29edb6ec4e763e53eef
        env:
          SNAPCRAFT_STORE_CREDENTIALS: >-
            ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  msi:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust
        # master
        uses: >-
          dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build release binary
        run: cargo build --release

      - name: Create WiX configuration
        shell: pwsh
        run: cargo wix init

      - name: Build MSI installer
        run: cargo wix --nocapture

      - name: Rename installer
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml |
            Select-String 'version = "(.+)"'
          ).Matches.Groups[1].Value
          Move-Item target/wix/rust-template-*.msi `
            "target/wix/rust-template-$version-x64.msi"

      - name: Upload MSI artifact
        # v4.6.2
        uses: >-
          actions/upload-artifact@47309c993abb98030a35d55ef7ff34b7fa1074b5
        with:
          name: windows-msi
          path: target/wix/*.msi
          retention-days: 90

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            target/wix/*.msi --clobber

  debian:
    name: Build Debian Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install cargo-deb
        # v2.67.25
        uses: >-
          taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12
        with:
          tool: cargo-deb@2.7.0

      - name: Setup Rust
        # master
        uses: >-
          dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release

      - name: Create debian package
        run: >-
          cargo deb --no-build
          --output target/debian/rust-template.deb

      - name: Upload debian package
        # v4.6.2
        uses: >-
          actions/upload-artifact@47309c993abb98030a35d55ef7ff34b7fa1074b5
        with:
          name: debian-package
          path: target/debian/*.deb
          retention-days: 90

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            target/debian/*.deb --clobber

  rpm:
    name: Build RPM Package (.rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install cargo-generate-rpm
        # v2.67.25
        uses: >-
          taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12
        with:
          tool: cargo-generate-rpm@0.15.1

      - name: Setup Rust
        # master
        uses: >-
          dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/rust-template

      - name: Create RPM package
        run: cargo generate-rpm

      - name: Upload RPM package
        # v4.6.2
        uses: >-
          actions/upload-artifact@47309c993abb98030a35d55ef7ff34b7fa1074b5
        with:
          name: rpm-package
          path: target/generate-rpm/*.rpm
          retention-days: 90

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            target/generate-rpm/*.rpm --clobber
