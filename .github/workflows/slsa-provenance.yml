
name: SLSA Provenance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # master
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
        with:
          base64-subjects: |
            ${{ hashFiles('target/release/rust-template') }}
          upload-assets: true
          
      - name: Upload provenance
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            --repo ${{ github.repository }} \
            --clobber \
            *.intoto.jsonl

  verify:
    name: Verify SLSA Provenance
    runs-on: ubuntu-latest
    needs: provenance
    
    steps:
      - name: Install SLSA verifier
        run: |
          wget https://github.com/slsa-framework/slsa-verifier/releases/download/v2.5.1/slsa-verifier-linux-amd64
          chmod +x slsa-verifier-linux-amd64
          sudo mv slsa-verifier-linux-amd64 /usr/local/bin/slsa-verifier

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ github.event.release.tag_name }} \
            --repo ${{ github.repository }}

      - name: Verify provenance
        run: |
          slsa-verifier verify-artifact \
            --provenance-path *.intoto.jsonl \
            --source-uri github.com/${{ github.repository }} \
            rust-template
