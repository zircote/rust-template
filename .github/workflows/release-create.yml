---
name: Create Release

"on":
  workflow_call:
    inputs:
      tag:
        description: "Git tag (e.g. v1.2.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release changelog
        id: changelog
        # v4.5.0
        uses: >-
          orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        id: create_release
        # v2.0.3
        uses: >-
          softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ inputs.tag }}
          name: >-
            Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false

      - name: Generate full changelog
        # v4.5.0
        uses: >-
          orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet CHANGELOG.md 2>/dev/null; then
            echo "No changes to commit"
            exit 0
          fi

          API_PATH="repos/${REPO}/contents/CHANGELOG.md"
          CONTENT=$(base64 -i CHANGELOG.md)
          SHA=$(gh api "$API_PATH" \
            --jq '.sha' 2>/dev/null || echo "")

          MSG="docs: update CHANGELOG.md for ${TAG_NAME}"
          ARGS=(
            -f "message=${MSG}"
            -f "content=${CONTENT}"
            -f "branch=main"
          )
          if [ -n "$SHA" ]; then
            ARGS+=(-f "sha=${SHA}")
          fi

          gh api "$API_PATH" \
            --method PUT "${ARGS[@]}"
          echo "Changelog updated via GitHub API"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rust_template
            asset_name: rust_template-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: rust_template
            asset_name: rust_template-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rust_template
            asset_name: rust_template-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rust_template
            asset_name: rust_template-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rust_template.exe
            asset_name: rust_template-windows-amd64.exe
    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        # master
        uses: >-
          dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: >-
            aarch64-linux-gnu-gcc
        run: >-
          cargo build --release
          --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact_name }}
        run: |
          if [ "$TARGET" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip \
              "target/${TARGET}/release/${ARTIFACT}"
          else
            strip "target/${TARGET}/release/${ARTIFACT}"
          fi

      - name: Rename binary for release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact_name }}
          ASSET: ${{ matrix.asset_name }}
        run: |
          cp "target/${TARGET}/release/${ARTIFACT}" "${ASSET}"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ matrix.asset_name }}
        run: |
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Upload artifact
        # v4.6.2
        uses: >-
          actions/upload-artifact@47309c993abb98030a35d55ef7ff34b7fa1074b5
        with:
          name: ${{ matrix.asset_name }}
          path: >-
            target/${{ matrix.target }}/release/${{
            matrix.artifact_name }}
