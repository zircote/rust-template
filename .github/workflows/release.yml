---
name: Release

# Attested delivery: build platform binaries, attach SLSA build provenance
# to each, generate + attest a CycloneDX SBOM, then fail-closed verify
# every attestation BEFORE the GitHub Release is published. A tag
# publishes nothing unattested.
#
# Project specificity is resolved at runtime from Cargo.toml (crate name,
# binary name, version) and the GitHub context (owner/repo) — there is
# nothing to rename in this file when the template is instantiated.
#
# Dry-run: `workflow_dispatch` from any branch exercises the full
# build -> attest -> verify chain; the publish job is tag-gated and skipped.

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve Project Metadata
    runs-on: ubuntu-latest
    outputs:
      bin: ${{ steps.meta.outputs.bin }}
      version: ${{ steps.meta.outputs.version }}
      publishable: ${{ steps.meta.outputs.publishable }}
    steps:
      - name: Checkout repository
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Rust toolchain
        # master
        uses: >-
          dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Resolve binary name and version from Cargo.toml
        id: meta
        run: |
          set -euo pipefail
          META=$(cargo metadata --no-deps --locked --format-version 1)
          BIN=$(jq -r \
            '[.packages[0].targets[] | select(.kind | index("bin"))][0].name' \
            <<< "$META")
          if [ -z "$BIN" ] || [ "$BIN" = "null" ]; then
            echo "::error::no [[bin]] target found in Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Dry-run (workflow_dispatch): Cargo.toml version, marked -dev
            VERSION="$(jq -r '.packages[0].version' <<< "$META")-dev"
          fi
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # `publish = false` in Cargo.toml (template state) disables
          # artifact publication; the build->attest->verify chain still
          # runs as CI validation.
          PUBLISHABLE=$(jq -r \
            'if .packages[0].publish == [] then "false" else "true" end' \
            <<< "$META")
          echo "publishable=${PUBLISHABLE}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${BIN} ${VERSION} (publishable: ${PUBLISHABLE})"

  build:
    name: Build (${{ matrix.platform }})
    needs: [meta]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          - os: macos-latest
            platform: macos-arm64
            ext: ""
          - os: macos-latest
            platform: macos-amd64
            target: x86_64-apple-darwin
            ext: ""
          - os: windows-latest
            platform: windows-amd64
            ext: ".exe"
    steps:
      - name: Checkout repository
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Rust toolchain
        # master
        uses: >-
          dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ matrix.target || '' }}

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target || '' }}
        run: |
          if [ -n "$TARGET" ]; then
            cargo build --release --locked --target "$TARGET"
          else
            cargo build --release --locked
          fi

      - name: Stage named artifact
        shell: bash
        env:
          BIN: ${{ needs.meta.outputs.bin }}
          VERSION: ${{ needs.meta.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target || '' }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          SRC="target/release/${BIN}${EXT}"
          if [ -n "$TARGET" ]; then
            SRC="target/${TARGET}/release/${BIN}${EXT}"
          fi
          cp "$SRC" "dist/${BIN}-${VERSION}-${PLATFORM}${EXT}"

      - name: Attest build provenance
        # v4.1.0
        uses: >-
          actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: dist/*

      - name: Upload artifact
        # v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: >-
            ${{ needs.meta.outputs.bin }}-${{
            needs.meta.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  test:
    # Tags are not guaranteed to point at CI-green commits; the release
    # publishes nothing untested.
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Rust toolchain
        # master
        uses: >-
          dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --all-features --locked

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install cargo-audit
        # v2.67.25
        uses: >-
          taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912
        with:
          tool: cargo-audit

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

  sbom:
    name: SBOM (generate + attest)
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Download all binaries
        # v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Only the release binaries (exclude the seam SARIF artifacts).
          pattern: ${{ needs.meta.outputs.bin }}-${{ needs.meta.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate CycloneDX SBOM
        # v0.24.0
        uses: >-
          anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: >-
            ${{ needs.meta.outputs.bin }}-${{
            needs.meta.outputs.version }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM (binds every binary to the SBOM)
        # v4.1.0
        uses: >-
          actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: dist/*
          sbom-path: >-
            ${{ needs.meta.outputs.bin }}-${{
            needs.meta.outputs.version }}-sbom.cdx.json

      - name: Upload SBOM artifact
        # v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: >-
            ${{ needs.meta.outputs.bin }}-${{
            needs.meta.outputs.version }}-sbom
          path: >-
            ${{ needs.meta.outputs.bin }}-${{
            needs.meta.outputs.version }}-sbom.cdx.json
          if-no-files-found: error

  verify:
    name: Verify Attestations
    needs: [meta, build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download all artifacts
        # v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Restrict to the release binaries + SBOM. Without this filter the
          # publish-gated seam jobs' SARIF artifacts (sast-sarif, scorecard-
          # sarif, iac-license-sarif, "OSV Scanner SARIF file") would merge
          # into dist/ too, breaking the 6-artifact count check and polluting
          # checksums / release assets.
          pattern: ${{ needs.meta.outputs.bin }}-${{ needs.meta.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Fail-closed attestation verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          # Every platform binary plus the SBOM must be present — a
          # partial set must never reach the release.
          if [ "${#files[@]}" -ne 6 ]; then
            echo "::error::expected 6 artifacts, found ${#files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$f" in
              *-sbom.cdx.json) continue ;;
            esac
            echo "Verifying provenance: ${f}"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
            echo "Verifying SBOM attestation: ${f}"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom
          done

  # -----------------------------------------------------------
  # Quality-gate attestation seam (gh-attested) — gated on
  # `publishable`, so it is dormant in template state and arms
  # downstream once `publish` is enabled. Gate verdicts attach to
  # the source-snapshot subject; the per-binary provenance + SBOM
  # above remain artifact-scoped. Producing attestations only;
  # wiring a fail-closed verify-gates job into `release.needs` is
  # the enforce step.
  # -----------------------------------------------------------
  snapshot:
    name: Source Snapshot Subject
    needs: [meta]
    if: needs.meta.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    outputs:
      subject-name: ${{ steps.snap.outputs.subject-name }}
      subject-digest: ${{ steps.snap.outputs.subject-digest }}
    steps:
      - name: Checkout repository
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Compute reproducible source-snapshot digest
        id: snap
        env:
          BIN: ${{ needs.meta.outputs.bin }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          DIGEST=$(git archive --format=tar "${GITHUB_SHA}" \
            | sha256sum | cut -d' ' -f1)
          echo "subject-name=${BIN}-${VERSION}-source" >> "$GITHUB_OUTPUT"
          echo "subject-digest=sha256:${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Source snapshot sha256:${DIGEST}"

  gate-sast:
    name: Gate — SAST (CodeQL)
    needs: [meta]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-sast-codeql.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4
    with:
      languages: rust
      build-mode: none

  gate-sca:
    name: Gate — SCA (OSV)
    needs: [meta]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-sca-osv.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4
    with:
      fail-on-severity: high
      # Scope OSV to the Rust crate lockfile (docs site npm deps are out of
      # scope for the crate's SCA gate).
      scan-args: |-
        --lockfile=Cargo.lock

  gate-posture:
    name: Gate — Scorecard
    needs: [meta]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-scorecard.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4

  gate-trivy:
    name: Gate — Trivy (IaC/license)
    needs: [meta]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-trivy.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4
    with:
      scan-iac: true

  attest-sast:
    name: Attest — SAST
    needs: [meta, snapshot, gate-sast]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      id-token: write
      attestations: write
      contents: read
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-attest-scan.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4
    with:
      subject-name: ${{ needs.snapshot.outputs.subject-name }}
      subject-digest: ${{ needs.snapshot.outputs.subject-digest }}
      predicate-type: https://zircote.github.io/attestations/sast/v1
      predicate-artifact: ${{ needs.gate-sast.outputs.sarif-artifact }}
      predicate-filename: ${{ needs.gate-sast.outputs.sarif-filename }}

  attest-sca:
    name: Attest — SCA
    needs: [meta, snapshot, gate-sca]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      id-token: write
      attestations: write
      contents: read
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-attest-scan.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4
    with:
      subject-name: ${{ needs.snapshot.outputs.subject-name }}
      subject-digest: ${{ needs.snapshot.outputs.subject-digest }}
      predicate-type: https://zircote.github.io/attestations/sca/v1
      predicate-artifact: ${{ needs.gate-sca.outputs.sarif-artifact }}
      predicate-filename: ${{ needs.gate-sca.outputs.sarif-filename }}

  attest-posture:
    name: Attest — Scorecard
    needs: [meta, snapshot, gate-posture]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      id-token: write
      attestations: write
      contents: read
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-attest-scan.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4
    with:
      subject-name: ${{ needs.snapshot.outputs.subject-name }}
      subject-digest: ${{ needs.snapshot.outputs.subject-digest }}
      predicate-type: https://zircote.github.io/attestations/scorecard/v1
      predicate-artifact: ${{ needs.gate-posture.outputs.sarif-artifact }}
      predicate-filename: ${{ needs.gate-posture.outputs.sarif-filename }}

  attest-iac-license:
    name: Attest — IaC/license
    needs: [meta, snapshot, gate-trivy]
    if: needs.meta.outputs.publishable == 'true'
    permissions:
      id-token: write
      attestations: write
      contents: read
    # zircote/.github main @ 77a87549 (merged 2026-06-16)
    uses: >-
      zircote/.github/.github/workflows/reusable-attest-scan.yml@77a87549a65c6c978a0e87efe0168ed3517f7ca4
    with:
      subject-name: ${{ needs.snapshot.outputs.subject-name }}
      subject-digest: ${{ needs.snapshot.outputs.subject-digest }}
      predicate-type: https://zircote.github.io/attestations/iac-license/v1
      predicate-artifact: ${{ needs.gate-trivy.outputs.sarif-artifact }}
      predicate-filename: ${{ needs.gate-trivy.outputs.sarif-filename }}

  release:
    name: Create Release
    if: >-
      startsWith(github.ref, 'refs/tags/')
      && needs.meta.outputs.publishable == 'true'
    needs: [meta, verify, audit, test]
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        # v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Restrict to the release binaries + SBOM. Without this filter the
          # publish-gated seam jobs' SARIF artifacts (sast-sarif, scorecard-
          # sarif, iac-license-sarif, "OSV Scanner SARIF file") would merge
          # into dist/ too, breaking the 6-artifact count check and polluting
          # checksums / release assets.
          pattern: ${{ needs.meta.outputs.bin }}-${{ needs.meta.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        env:
          BIN: ${{ needs.meta.outputs.bin }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cd dist
          sha256sum -- * > "${BIN}-${VERSION}-checksums.txt"

      - name: Create GitHub Release
        # v3.0.0
        uses: >-
          softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
        env:
          # A PAT (when configured) lets the release event propagate to
          # downstream workflows; the workflow_run trigger on the
          # Homebrew workflow is the reliable fallback either way.
          GITHUB_TOKEN: >-
            ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
