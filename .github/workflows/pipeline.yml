---
name: Pipeline

"on":
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to run"
        type: choice
        options:
          - all
          - ci
          - release
          - sign
          - publish
          - docker
          - packages
          - sbom
          - slsa
        default: ci

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.ref_type == 'tag'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  pull-requests: write

jobs:
  # -----------------------------------------------------------
  # CI Stage — runs on every push, PR, and tag
  # -----------------------------------------------------------
  ci:
    name: CI Checks
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'ci'
    uses: ./.github/workflows/ci-checks.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    name: Code Coverage
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'ci'
    uses: ./.github/workflows/ci-coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-matrix:
    name: Test Matrix
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'ci'))
    uses: ./.github/workflows/ci-test-matrix.yml

  # Required check context: "pin-check / pin-check" — asserts every
  # `uses:` reference is pinned to a full 40-char commit SHA.
  pin-check:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'ci'
    permissions:
      contents: read
    # zircote/.github main (2026-06-11)
    uses: >-
      zircote/.github/.github/workflows/pin-check.yml@e8f0dbde068cc0701e443e7b8d57ae9917de7da3

  # -----------------------------------------------------------
  # Docker — after CI; PR = build-only, push on main/tags
  # -----------------------------------------------------------
  docker:
    name: Docker
    needs: [ci]
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'docker'
    uses: ./.github/workflows/release-docker.yml
    with:
      push: >-
        ${{ github.event_name != 'pull_request' }}

  # -----------------------------------------------------------
  # Image attestation — centralized signer (SLSA Build L3
  # isolation boundary), then a fail-closed verify gate
  # -----------------------------------------------------------
  docker-sign:
    name: Sign and Attest Image
    needs: [docker]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'docker')
    permissions:
      id-token: write
      attestations: write
      packages: write
      contents: read
    # zircote/.github main (2026-06-11)
    uses: >-
      zircote/.github/.github/workflows/sign-and-attest.yml@e8f0dbde068cc0701e443e7b8d57ae9917de7da3
    with:
      image-name: ghcr.io/${{ github.repository }}
      image-digest: ${{ needs.docker.outputs.image-digest }}

  docker-verify:
    name: Verify Image Attestations
    needs: [docker, docker-sign]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'docker')
    permissions:
      id-token: write
      attestations: read
      packages: read
      contents: read
    # zircote/.github main (2026-06-11)
    uses: >-
      zircote/.github/.github/workflows/verify-attestation.yml@e8f0dbde068cc0701e443e7b8d57ae9917de7da3
    with:
      image-ref: >-
        ghcr.io/${{ github.repository }}@${{
        needs.docker.outputs.image-digest }}
      attestation-repo: ${{ github.repository }}

  # -----------------------------------------------------------
  # Release Stage — tags only; gated on the fail-closed verify
  # so a tag publishes nothing unsigned
  # -----------------------------------------------------------
  release:
    name: Create Release
    needs: [ci, docker-verify]
    if: >-
      (github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'release'))
    uses: ./.github/workflows/release-create.yml
    with:
      tag: ${{ github.ref_name }}

  sign:
    name: Sign Release
    needs: [release]
    if: >-
      (github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'sign'))
    uses: ./.github/workflows/release-sign.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Publish to crates.io
    needs: [release]
    if: >-
      (github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'publish'))
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CARGO_REGISTRY_TOKEN: >-
        ${{ secrets.CARGO_REGISTRY_TOKEN }}

  packages:
    name: Release Packages
    needs: [release]
    if: >-
      (github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'packages'))
    uses: ./.github/workflows/release-packages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: >-
        ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SNAPCRAFT_TOKEN: >-
        ${{ secrets.SNAPCRAFT_TOKEN }}

  sbom:
    name: SBOM Generation
    needs: [release]
    if: >-
      (github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'sbom'))
    uses: ./.github/workflows/release-sbom.yml
    with:
      tag: ${{ github.ref_name }}

  # -----------------------------------------------------------
  # SLSA — provenance for the released binaries via GitHub
  # artifact attestations; attests the published assets, not a
  # rebuild. Verify: gh attestation verify <file> --repo <o>/<r>
  # -----------------------------------------------------------
  slsa-binaries:
    name: Attest Release Binaries
    needs: [release]
    if: >-
      (github.ref_type == 'tag'
      && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'slsa'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern 'rust_template-*' \
            --dir assets
          rm -f assets/*.sig

      - name: Attest build provenance
        # v4.1.0
        uses: >-
          actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: assets/*
