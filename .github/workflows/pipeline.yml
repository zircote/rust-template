---
name: Pipeline

"on":
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to run"
        type: choice
        options:
          - all
          - ci
          - docker
        default: ci

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.ref_type == 'tag'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read
  pull-requests: write

jobs:
  # -----------------------------------------------------------
  # CI Stage — runs on every push, PR, and tag
  # -----------------------------------------------------------
  ci:
    name: CI Checks
    # stage 'docker' includes ci so the docker -> sign -> verify
    # chain is exercisable via dispatch (docker needs ci)
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'ci'
      || inputs.stage == 'docker'
    uses: ./.github/workflows/ci-checks.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage:
    name: Code Coverage
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'ci'
    uses: ./.github/workflows/ci-coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-matrix:
    name: Test Matrix
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'all'
      || inputs.stage == 'ci'))
    uses: ./.github/workflows/ci-test-matrix.yml

  # Required check context: "pin-check / pin-check" — asserts every
  # `uses:` reference is pinned to a full 40-char commit SHA.
  pin-check:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'ci'
    permissions:
      contents: read
    # zircote/.github main (2026-06-11)
    uses: >-
      zircote/.github/.github/workflows/pin-check.yml@e8f0dbde068cc0701e443e7b8d57ae9917de7da3

  # -----------------------------------------------------------
  # Docker — after CI; PR = build-only, push on main/tags
  # -----------------------------------------------------------
  docker:
    name: Docker
    needs: [ci]
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'docker'
    uses: ./.github/workflows/release-docker.yml
    with:
      push: >-
        ${{ github.event_name != 'pull_request' }}

  # -----------------------------------------------------------
  # Image attestation — centralized signer (SLSA Build L3
  # isolation boundary), then a fail-closed verify gate
  # -----------------------------------------------------------
  docker-sign:
    name: Sign and Attest Image
    needs: [docker]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'docker')
    permissions:
      id-token: write
      attestations: write
      packages: write
      contents: read
    # zircote/.github main (2026-06-11)
    uses: >-
      zircote/.github/.github/workflows/sign-and-attest.yml@e8f0dbde068cc0701e443e7b8d57ae9917de7da3
    with:
      image-name: ghcr.io/${{ github.repository }}
      image-digest: ${{ needs.docker.outputs.image-digest }}

  docker-verify:
    name: Verify Image Attestations
    needs: [docker, docker-sign]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
      || inputs.stage == 'all'
      || inputs.stage == 'docker')
    permissions:
      id-token: write
      attestations: read
      packages: read
      contents: read
    # zircote/.github main (2026-06-11)
    uses: >-
      zircote/.github/.github/workflows/verify-attestation.yml@e8f0dbde068cc0701e443e7b8d57ae9917de7da3
    with:
      image-ref: >-
        ghcr.io/${{ github.repository }}@${{
        needs.docker.outputs.image-digest }}
      attestation-repo: ${{ github.repository }}

