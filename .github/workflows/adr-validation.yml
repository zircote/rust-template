---
name: ADR Validation

"on":
  pull_request:
    paths:
      - 'docs/adr/**'
  push:
    branches: [main, master]
    paths:
      - 'docs/adr/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate ADRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate ADR Format
        # main
        uses: zircote/adrscope@3f5aac04eb6eb13e461566e750760501ec7b4698
        with:
          command: validate
          adr-path: docs/adr

      - name: Get ADR Statistics
        # main
        uses: zircote/adrscope@3f5aac04eb6eb13e461566e750760501ec7b4698
        with:
          command: stats
          adr-path: docs/adr

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        # v9.0.0
        uses: >-
          actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const statsFile = 'adr-stats.json';

            if (!fs.existsSync(statsFile)) {
              console.log('No stats file generated');
              return;
            }

            const stats = JSON.parse(fs.readFileSync(statsFile, 'utf8'));

            const comment = `## ADR Validation Results

            📊 **Statistics:**
            - Total ADRs: ${stats.total || 0}
            - Accepted: ${stats.accepted || 0}
            - Proposed: ${stats.proposed || 0}
            - Deprecated: ${stats.deprecated || 0}
            - Superseded: ${stats.superseded || 0}

            ✅ All ADRs validated successfully!`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
